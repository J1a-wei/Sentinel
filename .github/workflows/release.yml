name: Release

# 仅 tag v* 触发。PR 永远不会触发本工作流，因此不会接触发布凭证；
# PR/push 的普通检查在 ci.yml 中完成，本工作流通过 workflow_call 复用它作为发布门禁。
#
# 发布链路：CI 门禁 -> 多架构构建并推送 GHCR -> cosign keyless 按 digest 签名
# -> 严格验证（多架构 manifest + 精确证书 identity/issuer，任何失败即中止）
# -> 原生包逐文件 sign-blob/verify-blob -> GitHub Release 附镜像与原生包验证命令。

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  # GHCR 命名空间必须小写
  HUB_IMAGE: ghcr.io/j1a-wei/sentinel-hub
  SCOUT_IMAGE: ghcr.io/j1a-wei/sentinel-scout
  CERT_IDENTITY_PREFIX: https://github.com/J1a-wei/Sentinel/.github/workflows/release.yml
  OIDC_ISSUER: https://token.actions.githubusercontent.com

jobs:
  ci:
    name: 发布前 CI 门禁
    uses: ./.github/workflows/ci.yml
    with:
      native_version: ${{ github.ref_name }}

  images:
    name: 构建并推送多架构镜像
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      hub_digest: ${{ steps.hub.outputs.digest }}
      scout_digest: ${{ steps.scout.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # docker/setup-qemu-action v4.4.0，SHA 来自官方仓库 tag
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      # docker/setup-buildx-action v4.4.1，SHA 来自官方仓库 tag
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # docker/login-action v4.6.0，SHA 来自官方仓库 tag
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # docker/build-push-action v7.4.0，SHA 来自官方仓库 tag
      # 多架构 digest 输出为 manifest index 的 digest，签名与验证均针对该 digest。
      # provenance 关闭：SBOM/attestation 未在当前范围实现，不在未实现时声称产出。
      - name: 构建并推送 hub
        id: hub
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          target: hub
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ env.HUB_IMAGE }}:${{ github.ref_name }}
      - name: 构建并推送 scout
        id: scout
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          target: scout
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ env.SCOUT_IMAGE }}:${{ github.ref_name }}

  sign:
    name: cosign keyless 签名（按 digest）
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      # sigstore/cosign-installer v4.1.2，SHA 来自官方仓库 tag
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 签名（GitHub OIDC keyless，绑定 tag ref 的精确 workflow identity）
        env:
          HUB_DIGEST: ${{ needs.images.outputs.hub_digest }}
          SCOUT_DIGEST: ${{ needs.images.outputs.scout_digest }}
        run: |
          set -eux
          cosign sign --yes "${HUB_IMAGE}@${HUB_DIGEST}"
          cosign sign --yes "${SCOUT_IMAGE}@${SCOUT_DIGEST}"

  verify:
    name: 签名与多架构验证（失败即中止发布）
    needs: [images, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      HUB_DIGEST: ${{ needs.images.outputs.hub_digest }}
      SCOUT_DIGEST: ${{ needs.images.outputs.scout_digest }}
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 校验多架构 manifest（python3 解析，不依赖字段顺序）
        run: |
          set -eux
          for ref in "${HUB_IMAGE}@${HUB_DIGEST}" "${SCOUT_IMAGE}@${SCOUT_DIGEST}"; do
            docker buildx imagetools inspect --format '{{json .Manifest}}' "$ref" > manifest.json
            python3 - manifest.json <<'PYEOF'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              data = json.load(handle)
          platforms = set()
          for entry in data.get("manifests", []):
              platform = entry.get("platform") or {}
              os_name = platform.get("os")
              arch = platform.get("architecture")
              if os_name and arch:
                  platforms.add(f"{os_name}/{arch}")
          required = {"linux/amd64", "linux/arm64"}
          missing = required - platforms
          if missing:
              print(f"manifest 缺少平台: {sorted(missing)}", file=sys.stderr)
              sys.exit(1)
          print("manifest 平台验证通过:", sorted(required & platforms))
          PYEOF
          done
      - name: cosign 严格验证（精确 identity + issuer，默认强制 tlog）
        run: |
          set -eux
          identity="${CERT_IDENTITY_PREFIX}@refs/tags/${GITHUB_REF_NAME}"
          cosign verify \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "${OIDC_ISSUER}" \
            "${HUB_IMAGE}@${HUB_DIGEST}"
          cosign verify \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "${OIDC_ISSUER}" \
            "${SCOUT_IMAGE}@${SCOUT_DIGEST}"

  sign_native:
    name: 原生包 Cosign 签名与验证
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-amd64
          path: native-dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-arm64
          path: native-dist
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: 签名并验证两种架构的完整归档（不执行归档内容）
        run: |
          set -euo pipefail
          identity="${CERT_IDENTITY_PREFIX}@refs/tags/${GITHUB_REF_NAME}"
          for arch in amd64 arm64; do
            archive="native-dist/sentinel-${GITHUB_REF_NAME}-linux-${arch}.tar.gz"
            test -s "$archive"
            cosign sign-blob --yes --bundle "${archive}.sigstore.json" "$archive"
            cosign verify-blob \
              --bundle "${archive}.sigstore.json" \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer "$OIDC_ISSUER" "$archive"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-signed
          path: native-dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: 创建 GitHub Release
    needs: [ci, images, sign, verify, sign_native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HUB_DIGEST: ${{ needs.images.outputs.hub_digest }}
      SCOUT_DIGEST: ${{ needs.images.outputs.scout_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-signed
          path: native-dist
      - name: 生成发布说明并创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          version="${GITHUB_REF_NAME}"
          cat > release-notes.md <<NOTES
          # Sentinel ${version}

          本版本由 GitHub Actions（\`.github/workflows/release.yml\`，tag \`refs/tags/${version}\`）构建并签名。

          ## 镜像

          - Hub：\`${HUB_IMAGE}@${HUB_DIGEST}\`
          - Scout：\`${SCOUT_IMAGE}@${SCOUT_DIGEST}\`

          支持平台：linux/amd64、linux/arm64。

          ## 签名验证（推荐安装前自行执行）

          使用 cosign 3.x（与发布工作流固定的 v3.0.6 一致；v2 对本格式未验证）验证镜像来自本仓库发布工作流：

          \`\`\`sh
          cosign verify \\
            --certificate-identity "https://github.com/J1a-wei/Sentinel/.github/workflows/release.yml@refs/tags/${version}" \\
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \\
            "${SCOUT_IMAGE}@${SCOUT_DIGEST}"
          \`\`\`

          要求：精确匹配上述 certificate-identity（不接受任意正则）与 issuer，默认强制
          Sigstore 透明日志（tlog）校验；任一验证失败请勿使用该镜像。

          ## 安装 Scout

          详见 [docs/deployment.md](docs/deployment.md)。安装脚本（下载审查后运行）：

          \`\`\`sh
          scripts/install-scout.sh --version ${version} \\
            --hub-url <Hub 地址> --nats-url <NATS 地址> [其他参数]
          \`\`\`

          安装脚本内置上述同等的 digest + identity + issuer 验证，验证失败立即退出，
          不会启动特权容器。

          ## systemd 原生部署

          附件提供 Ubuntu 22.04/24.04 的 amd64、arm64 原生包，包含 Hub、Scout、
          前端静态资源与 systemd 服务单元。原生部署不需要 Docker；Hub 连接已有的
          PostgreSQL 和 NATS。每个 tar.gz 附有对应的 Sigstore bundle。

          下载归档与签名 bundle 后，使用 cosign 3.x 验证完整归档：

          \`\`\`sh
          ARCH=amd64
          ARCHIVE="sentinel-${version}-linux-\${ARCH}.tar.gz"
          cosign verify-blob \\
            --bundle "\${ARCHIVE}.sigstore.json" \\
            --certificate-identity "${CERT_IDENTITY_PREFIX}@refs/tags/${version}" \\
            --certificate-oidc-issuer "${OIDC_ISSUER}" "\${ARCHIVE}"
          \`\`\`

          \`scripts/install-systemd.sh --component scout|hub --version ${version}\`
          自动下载并验证归档后安装。完整参数和凭证文件准备方式见部署指南。
          Scout 自动判断运行环境，\`scout doctor\` 可只读诊断；未知环境需明确配置。

          ## 当前阶段声明

          Sentinel 处于一期 A 开发阶段：仅覆盖只读资产采集与上报；漏洞评估、基线检查、
          自动升级、系统日志接入尚未实现。自动升级由 Scout 后续功能承担，安装脚本不
          提供安全自动升级。跨主机部署的 TLS 与每主机身份边界尚未实现，见
          [docs/deployment.md](docs/deployment.md)。
          NOTES
          gh release create "$version" \
            native-dist/*.tar.gz native-dist/*.tar.gz.sigstore.json \
            --title "Sentinel ${version}" \
            --verify-tag \
            --notes-file release-notes.md
